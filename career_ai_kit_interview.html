<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAREER AI KIT｜面接対策</title>
<style>
:root{--navy:#172A46;--beige:#D8C8AE;--cream:#F8F6F1;--text:#333;--muted:#777;--line:#e5ddd5}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 18px 56px}
.brand{font-size:12px;letter-spacing:.2em;color:var(--navy);font-weight:800}
.hero{padding:14px 0 22px}
h1{font-size:29px;line-height:1.4;color:var(--navy);margin:8px 0}
.sub{font-size:14px;line-height:1.8;color:#555}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 6px 20px rgba(23,42,70,.05)}
.step{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:5px 11px;font-size:11px;letter-spacing:.08em;font-weight:700}
h2{font-size:18px;color:var(--navy);margin:12px 0 18px}
label{display:block;font-size:14px;font-weight:700;margin:18px 0 7px}
textarea{width:100%;min-height:105px;border:1px solid #d8d8d8;border-radius:10px;padding:12px;font:inherit;font-size:14px;line-height:1.65;resize:vertical;background:#fff}
textarea:focus{outline:2px solid rgba(23,42,70,.15);border-color:var(--navy)}
button{width:100%;border:0;border-radius:10px;padding:14px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:18px}
.primary{background:var(--navy);color:#fff}
.secondary{background:var(--beige);color:var(--navy)}
.result{display:none}
.result textarea{min-height:500px;background:#faf9f6}
.notice{font-size:12px;line-height:1.8;color:#666;background:#f4efe7;border-radius:10px;padding:12px;margin-top:16px}
.success{text-align:center;color:#24604a;font-weight:700;margin-top:12px;display:none}
footer{text-align:center;color:#999;font-size:11px;line-height:1.7;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">CAREER AI KIT</div>
<div class="hero">
<h1>面接対策をAIで行う</h1>
<div class="sub">応募企業とあなたの経験をもとに、想定質問・回答例・逆質問をまとめて準備します。</div>
</div>

<div class="card">
<span class="step">STEP 1</span>
<h2>面接に必要な情報を入力</h2>

<label>応募企業・会社名</label>
<textarea id="company" style="min-height:70px" placeholder="例：株式会社○○"></textarea>

<label>求人票・募集内容</label>
<textarea id="job" placeholder="求人票の仕事内容、応募条件、求める人物像など"></textarea>

<label>これまでの職歴・仕事内容</label>
<textarea id="career" placeholder="会社名、勤務期間、仕事内容、担当業務など"></textarea>

<label>自分の強み・アピールしたいこと</label>
<textarea id="strength" placeholder="例：事務経験、調整力、正確性、改善経験など"></textarea>

<label>退職・転職を考えている理由</label>
<textarea id="change" placeholder="面接で説明したい転職理由を入力してください"></textarea>

<label>応募先を志望する理由</label>
<textarea id="reason" placeholder="なぜこの会社・仕事に応募したいのか"></textarea>

<label>面接で不安なこと</label>
<textarea id="anxiety" placeholder="例：退職理由を聞かれるのが不安、緊張してうまく話せないなど"></textarea>

<button class="primary" onclick="makePrompt()">面接対策プロンプトを作る</button>
</div>

<div class="card result" id="result">
<span class="step">STEP 2</span>
<h2>生成されたプロンプト</h2>
<textarea id="prompt" readonly></textarea>
<button class="primary" onclick="copyPrompt()">プロンプトをコピーする</button>
<button class="secondary" onclick="openChatGPT()">ChatGPTを開く</button>
<div class="success" id="success">コピーしました！ChatGPTに貼り付けてください。</div>
<div class="notice">※回答例は丸暗記せず、自分の言葉で話せるように調整してください。実際に経験していないことや架空の実績は使用しないでください。</div>
</div>

<footer>CAREER AI KIT｜転職活動をAIで効率化するためのツール</footer>
</div>

<script>
function v(id){return document.getElementById(id).value.trim()||"（未入力）";}
function makePrompt(){
const prompt=`あなたは転職面接に詳しいキャリアアドバイザーです。
以下の情報をもとに、応募者が実際の面接で自分の言葉で答えられるよう、具体的な面接対策を作成してください。

【応募企業】
${v("company")}

【求人票・募集内容】
${v("job")}

【応募者の職歴・仕事内容】
${v("career")}

【応募者の強み・アピールしたいこと】
${v("strength")}

【退職・転職を考えている理由】
${v("change")}

【応募先を志望する理由】
${v("reason")}

【面接で不安なこと】
${v("anxiety")}

【作成してほしいもの】
①この企業で聞かれそうな面接質問10個
②それぞれの質問への回答例
③「1分程度」で答えられる自己紹介
④「あなたの強みは？」への回答例
⑤「弱み・苦手なことは？」への回答例
⑥「転職理由・退職理由は？」への回答例
⑦「なぜ当社なのですか？」への回答例
⑧「入社したら何をしたいですか？」への回答例
⑨「仕事で大変だったこと・乗り越えたこと」への回答例
⑩「失敗した経験」への回答例
⑪「5年後どうなっていたいですか？」への回答例
⑫面接官に聞くべき逆質問10個
⑬避けたほうがいい回答・言い方
⑭この応募者が面接で最もアピールすべきポイント5つ
⑮面接直前に確認するチェックリスト10項目

【回答作成ルール】
・応募者が実際に経験していないことは作らない。
・実績、数字、資格などを勝手に追加しない。
・退職理由は前職への不満だけにならず、今後の方向性につながる表現にする。
・回答例は難しい言葉を避け、実際に本人が話しやすい自然な日本語にする。
・求人票と応募者の経験を具体的に結びつける。
・面接官が追加で深掘りしそうなポイントも各回答に1つ添える。
・最後に「この面接で絶対に伝えるべき3点」をまとめる。`;

document.getElementById("prompt").value=prompt;
document.getElementById("result").style.display="block";
document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
async function copyPrompt(){
const el=document.getElementById("prompt");
try{await navigator.clipboard.writeText(el.value);}
catch(e){el.select();document.execCommand("copy");}
document.getElementById("success").style.display="block";
setTimeout(()=>document.getElementById("success").style.display="none",2500);
}
function openChatGPT(){window.open("https://chatgpt.com/","_blank");}
</script>
</body>
</html>
